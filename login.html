<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول | البشمهندس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-box { background: rgba(30, 41, 59, 0.8); padding: 40px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 8px; border: none; background: #334155; color: white; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        .btn { width: 100%; padding: 12px; background: #0ea5e9; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn:hover { background: #0284c7; }
        .error-msg { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>تسجيل الدخول</h2>
        
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="text" name="phone" placeholder="رقم الموبايل" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit" class="btn">دخول</button>
        </form>
        <a href="/" style="display: block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px;">العودة للرئيسية</a>
    </div>
</body>
</html>
