<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب جديد | البشمهندس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon-cyan: #00f3ff; --neon-orange: #ff9d00; --bg-deep: #030712; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-deep); background-image: radial-gradient(circle at top, rgba(0, 243, 255, 0.1), transparent 50%), radial-gradient(circle at bottom, rgba(255, 157, 0, 0.1), transparent 50%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; color: white; }
        .form-box { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(15px); padding: 40px; border-radius: 15px; border: 1px solid rgba(0, 243, 255, 0.2); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 243, 255, 0.05) inset; position: relative; overflow: hidden; }
        .form-box::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 2px; background: var(--neon-orange); box-shadow: 0 0 15px var(--neon-orange); }
        h2 { color: white; margin-top: 0; font-weight: 900; margin-bottom: 25px; }
        h2 span { color: var(--neon-orange); text-shadow: 0 0 10px rgba(255, 157, 0, 0.5); }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: var(--neon-cyan); font-family: 'Cairo', sans-serif; font-size: 15px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--neon-cyan); outline: none; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
        .btn { width: 100%; padding: 12px; background: transparent; color: var(--neon-orange); border: 1px solid var(--neon-orange); border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; font-family: 'Cairo', sans-serif; transition: 0.3s; text-shadow: 0 0 5px var(--neon-orange); }
        .btn:hover { background: var(--neon-orange); color: var(--bg-deep); box-shadow: 0 0 20px var(--neon-orange); transform: translateY(-2px); }
        .error-msg { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; font-weight: bold; text-shadow: 0 0 5px rgba(239, 68, 68, 0.5); }
        .captcha-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px dashed rgba(255, 157, 0, 0.4); text-align: right; }
        a { color: #94a3b8; text-decoration: none; font-size: 14px; transition: 0.3s; display: block; margin-top: 20px;}
        a:hover { color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan); }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>حساب <span>جديد</span></h2>
        {% if error %}
            <div class="error-msg">⚠️ {{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="name" placeholder="الاسم رباعي (مطلوب)" required>
            <input type="text" name="phone" placeholder="رقم الموبايل" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            
            <div class="captcha-box">
                <label style="color: #cbd5e1; font-size: 14px; display: block; margin-bottom: 8px;">
                    🤖 <strong>نظام الحماية:</strong> كم مجموع ( {{ num1 }} + {{ num2 }} ) ؟
                </label>
                <input type="number" name="captcha" placeholder="اكتب الناتج هنا" required style="margin: 0; color: #ff9d00;">
            </div>

            <button type="submit" class="btn">إنشاء الحساب ⚡</button>
        </form>
        <a href="/login">لديك حساب بالفعل؟ تسجيل الدخول</a>
    </div>
</body>
</html>
