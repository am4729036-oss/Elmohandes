<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب | البشمهندس عبدالرحمن</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-box { background: rgba(30, 41, 59, 0.8); padding: 40px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); width: 380px; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #334155; color: white; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        select option { background: #1e293b; color: white; }
        .btn { width: 100%; padding: 12px; background: #0ea5e9; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn:hover { background: #0284c7; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>إنشاء حساب جديد</h2>
        <p style="color: #94a3b8; font-size: 14px;">سجل بياناتك للانضمام لدروس الرياضيات</p>
        <form method="POST">
            <input type="text" name="name" placeholder="الاسم بالكامل" required>
            <input type="text" name="phone" placeholder="رقم الموبايل (واتساب)" required>
            
            <!-- قايمة اختيار الصف الدراسي -->
            <select name="grade" required>
                <option value="" disabled selected>اختر صفك الدراسي</option>
                <optgroup label="المرحلة الابتدائية">
                    <option value="رابعة ابتدائي">رابعة ابتدائي</option>
                    <option value="خامسة ابتدائي">خامسة ابتدائي</option>
                    <option value="سادسة ابتدائي">سادسة ابتدائي</option>
                </optgroup>
                <optgroup label="المرحلة الإعدادية">
                    <option value="أولى إعدادي">أولى إعدادي</option>
                    <option value="ثانية إعدادي">ثانية إعدادي</option>
                    <option value="ثالثة إعدادي">ثالثة إعدادي</option>
                </optgroup>
            </select>

            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit" class="btn">تسجيل الحساب</button>
        </form>
    </div>
</body>
</html>
