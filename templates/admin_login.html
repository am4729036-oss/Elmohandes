<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة الإدارة | أكاديمية البشمهندس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #020617; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-box { background: rgba(220, 38, 38, 0.1); padding: 40px; border-radius: 15px; border: 1px solid #ef4444; width: 350px; text-align: center; box-shadow: 0 10px 40px rgba(239, 68, 68, 0.2); }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px; border: none; background: #1e293b; color: white; box-sizing: border-box; text-align: center; font-size: 18px; letter-spacing: 5px; }
        .btn { width: 100%; padding: 12px; background: #ef4444; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #dc2626; box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4); }
        
        /* تصميم رسالة الخطأ وحركة الاهتزاز */
        .error-message { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; animation: shake 0.4s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body>
    <div class="form-box">
        <h2 style="color: #ef4444; margin-bottom: 5px;">المنطقة المحظورة 🛡️</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">تسجيل الدخول للإدارة فقط</p>
        
        <!-- لو في خطأ، هيظهر المربع ده -->
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <input type="password" name="password" placeholder="كلمة السر السريـــة" required>
            <button type="submit" class="btn">دخول للوحة التحكم</button>
        </form>
        <a href="/" style="display: block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px;">العودة للموقع</a>
    </div>
</body>
</html>
