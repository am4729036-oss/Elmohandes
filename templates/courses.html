<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الكورسات | أكاديمية البشمهندس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5; --secondary: #0ea5e9;
            --dark: #0f172a; --darker: #020617;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc; --text-muted: #94a3b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--darker); color: var(--text); overflow-x: hidden; padding-top: 100px; }

        /* شريط التنقل */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05);
            position: fixed; width: 100%; top: 0; z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: 900; color: #fff; text-decoration: none;}
        .logo span { color: var(--secondary); }
        .back-btn { 
            color: var(--text); text-decoration: none; font-weight: 600;
            background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 20px; transition: 0.3s;
        }
        .back-btn:hover { background: var(--primary); }

        /* عنوان الصفحة */
        .page-title { text-align: center; margin-bottom: 50px; }
        .page-title h1 { font-size: 2.5rem; color: var(--secondary); margin-bottom: 10px; }
        .page-title p { color: var(--text-muted); font-size: 1.1rem; }

        /* شبكة الفيديوهات (Grid) */
        .courses-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px; padding: 0 5%; max-width: 1200px; margin: 0 auto 50px;
        }

        /* كارت الفيديو */
        .video-card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 15px; overflow: hidden; transition: 0.4s;
            backdrop-filter: blur(10px);
        }
        .video-card:hover { transform: translateY(-10px); border-color: var(--secondary); box-shadow: 0 10px 30px rgba(14, 165, 233, 0.2); }
        
        .video-container { width: 100%; aspect-ratio: 16/9; }
        .video-container iframe { width: 100%; height: 100%; border: none; }
        
        .card-content { padding: 20px; }
        .card-content h3 { font-size: 1.3rem; margin-bottom: 10px; color: #fff; }
        .card-content p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 15px; }
        
        .download-btn {
            display: block; text-align: center; background: rgba(14, 165, 233, 0.1);
            color: var(--secondary); text-decoration: none; padding: 10px;
            border-radius: 8px; font-weight: bold; border: 1px solid rgba(14, 165, 233, 0.3); transition: 0.3s;
        }
        .download-btn:hover { background: var(--secondary); color: #fff; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">أكاديمية <span>البشمهندس</span></a>
        <a href="/" class="back-btn">العودة للرئيسية</a>
    </header>

    <div class="page-title">
        <h1>مسارات التعلم والفيديوهات</h1>
        <p>اختر الدرس وابدأ المذاكرة فوراً</p>
    </div>

    <!-- شبكة عرض الفيديوهات -->
    <div class="courses-grid">
        <!-- الكود ده بيخلي بايثون يلف على كل الفيديوهات اللي ضفناها ويعملها كارت أوتوماتيك -->
        {% for course in courses %}
        <div class="video-card">
            <div class="video-container">
                <!-- هنا بيتم وضع لينك الفيديو -->
                <iframe src="{{ course.video_url }}" allowfullscreen></iframe>
            </div>
            <div class="card-content">
                <!-- هنا عنوان ووصف الفيديو -->
                <h3>{{ course.title }}</h3>
                <p>{{ course.description }}</p>
                <a href="#" class="download-btn">📥 تحميل مذكرة الدرس (PDF)</a>
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
