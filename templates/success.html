<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تم بنجاح | أكاديمية البشمهندس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات لعلامة الصح -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #0f172a; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .success-box { 
            background: rgba(30, 41, 59, 0.9); 
            padding: 50px 40px; 
            border-radius: 20px; 
            border: 1px solid #10b981; 
            width: 450px; 
            text-align: center; 
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.15); 
        }
        .icon { 
            font-size: 80px; 
            color: #10b981; 
            margin-bottom: 20px; 
            /* تأثير حركة لعلامة الصح */
            animation: pop 0.5s ease-out; 
        }
        @keyframes pop { 
            0% { transform: scale(0); } 
            80% { transform: scale(1.2); } 
            100% { transform: scale(1); } 
        }
        h2 { color: #10b981; margin-bottom: 15px; font-size: 28px; font-weight: 800; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.8; margin-bottom: 30px; }
        .btn { 
            display: inline-block; 
            padding: 12px 30px; 
            background: transparent; 
            color: #0ea5e9; 
            border: 2px solid #0ea5e9; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            text-decoration: none; 
            transition: 0.3s; 
            font-weight: bold; 
        }
        .btn:hover { background: #0ea5e9; color: white; transform: translateY(-3px); }
    </style>
</head>
<body>
    <div class="success-box">
        <i class="fa-solid fa-circle-check icon"></i>
        <h2>تم استلام الإيصال بنجاح!</h2>
        <p>جاري مراجعة عملية الدفع من قبل الإدارة.<br>سيتم تفعيل حسابك وفتح مسارات التعلم فور التأكد من التحويل.</p>
        <a href="/" class="btn">العودة للرئيسية</a>
    </div>
</body>
</html>
