<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>استعادة الحساب | البشمهندس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
    <style>
        :root { --neon-cyan: #00f3ff; --neon-orange: #ff9d00; --bg-deep: #030712; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-deep); background-image: radial-gradient(circle at top, rgba(0, 243, 255, 0.1), transparent 50%), radial-gradient(circle at bottom, rgba(255, 157, 0, 0.1), transparent 50%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; color: white; }
        .form-box { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(15px); padding: 40px; border-radius: 15px; border: 1px solid rgba(0, 243, 255, 0.2); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 243, 255, 0.05) inset; position: relative; }
        .form-box::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 60%; height: 2px; background: #ef4444; box-shadow: 0 0 15px #ef4444; }
        h2 { color: white; margin-top: 0; font-weight: 900; margin-bottom: 25px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: var(--neon-cyan); font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: transparent; color: #ef4444; border: 1px solid #ef4444; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; font-family: 'Cairo', sans-serif; transition: 0.3s; }
        .btn:hover { background: #ef4444; color: white; box-shadow: 0 0 20px #ef4444; }
        .error-msg { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; }
        .success-msg { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); padding: 20px; border-radius: 8px; font-size: 16px; line-height: 1.6; font-weight: bold;}
    </style>
</head>
<body>
    
    <nav style="position: fixed; top: 0; left: 0; width: 100%; padding: 15px 30px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; z-index: 100;">
        <a href="/" style="color: var(--neon-cyan); font-weight: 900; font-size: 20px; text-decoration: none; text-shadow: 0 0 10px rgba(0,243,255,0.4);">البشمهندس 🏠</a>
        
    <div class="form-box">
        <h2>استعادة <span>الحساب</span></h2>
        
        {% if success %}
            <div class="success-msg">{{ success }}</div>
            <a href="/login" style="display: block; margin-top: 20px; color: #94a3b8; text-decoration: none;">العودة لتسجيل الدخول</a>
        {% else %}
            {% if error %}
                <div class="error-msg">⚠️ {{ error }}</div>
            {% endif %}
            
            <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 20px;">أدخل بياناتك المسجلة للبحث عن حسابك.</p>
            
            <form method="POST">
                <input type="text" name="name" placeholder="الاسم رباعي (كما سجلته)" required>
                <input type="text" name="phone" placeholder="رقم الموبايل المسجل" required>
                <button type="submit" class="btn">البحث عن حسابي 🔍</button>
            </form>
            <a href="/login" style="display: block; margin-top: 20px; color: #94a3b8; text-decoration: none;">إلغاء والعودة</a>
        {% endif %}
    </div>
</body>
</html>
